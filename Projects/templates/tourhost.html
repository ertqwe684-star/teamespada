<html>
<head>
<title>Tournament Host</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='tourhost.css') }}">
<script>
function addRow() {
    let tableBody = document.getElementById("billBody");
    let row = document.createElement("tr");
    row.innerHTML = `
        <td><input type="date" name="date"></td>
        <td><input type="time" name="time"></td>
        <td><input type="text" name="event"></td>
        <td>
            <button onclick="removeRow(this)" style="background:#dc3545;width:50%">X</button>
        </td>
    `;
    tableBody.appendChild(row);
}

function removeRow(btn) {
    btn.parentElement.parentElement.remove();
}

function submitEvents() {
    let rows = document.querySelectorAll("#billBody tr");
    let data = [];
    rows.forEach(row => {
        let inputs = row.querySelectorAll("input");
        data.push({
            date: inputs[0].value,
            time: inputs[1].value,
            event: inputs[2].value
        });
    });

    let tournamentType = document.getElementById("tp").value;
    if (tournamentType == "" || tournamentType == null) {
        alert("Please select tournament type");
        return;
    }
    let finalData = {
        tournament: tournamentType,
        events: data
    };

    fetch("/save_events", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(finalData)
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        window.location.href = "/";
    });

}

</script>
</head>
<body>
<div class="menu_bar">
    <h1 class="logo">TEAM<span> ESPADA</span></h1>
    <ul>
        <li1 style="color:#e9e9e9;font-weight:bold;font-size:25px;">
            ADMIN: S4NDY GL
        </li1>
    </ul>
</div>
<div style="padding:25px;">
<div class="hosttourtb">
<div class="cty_select">
<label for="tp">Select the tournament you wanted to host :</label>
<select id="tp" name="tp" required>
    <option value="" selected disabled>Select</option>
    <option value="solo">SOLO TOURNAMENT</option>
    <option value="duo">DUO TOURNAMENT</option>
    <option value="squad">SQUAD TOURNAMENT</option>
    <option value="cs">CLASH SQUAD TOURNAMENT</option>
</select>
</div>
<table id="billTable" style="width:50%;">
<tr>
    <th>Date</th>
    <th>Time</th>
    <th>Event</th>
    <th>Remove</th>
</tr>
<tbody id="billBody"></tbody>
</table>
<div style="margin-left:25px;">
    <button onclick="addRow()">Add Event</button>
</div>
<div style="margin-left:25px;text-align:right;">
    <button onclick="submitEvents()">Host</button>
</div>
</div>
</div>
</body>
</html>
